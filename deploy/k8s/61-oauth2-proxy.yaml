# Apply via deploy/install.sh (envsubst ${EE_HOST}), not bare kubectl. The redirect-url host must
# match the Google OAuth client's registered redirect URI — stable because the LB IP is reserved (TF).
# oauth2-proxy — Google OIDC gate in front of the API. Unauthenticated requests get redirected to
# Google; on success it proxies to eval-engine-api and passes X-Auth-Request-Email upstream.
# Access is restricted two ways: the Google consent screen's Test Users AND the emails file below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-emails
  namespace: eval-engine
data:
  emails: |
    victor.passichenko@gmail.com
    ravenkklo@gmail.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: eval-engine
  labels: { app: oauth2-proxy }
spec:
  replicas: 2                       # HA: the single auth gate in front of the whole UI+API (RESILIENCE.md §3.4)
  selector: { matchLabels: { app: oauth2-proxy } }
  template:
    metadata:
      labels: { app: oauth2-proxy }
    spec:
      nodeSelector: { eval-engine/role: system }
      topologySpreadConstraints:    # spread across nodes when >1 (soft; single-zone POC — RESILIENCE §3.1)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: oauth2-proxy } }
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --provider=google
            - --email-domain=*
            - --authenticated-emails-file=/etc/oauth2-proxy/emails
            # Path-based upstreams: /grafana(/.*)? → Grafana (it serves from that sub-path and trusts
            # the forwarded X-Auth-Request-Email); everything else → the Next.js frontend (catch-all).
            # The exact `/grafana` (no trailing slash) entry is needed so the bare URL reaches Grafana
            # (which 302s to /grafana/) instead of falling through to the frontend's 404.
            - --upstream=http://grafana:3000/grafana
            - --upstream=http://grafana:3000/grafana/
            - --upstream=http://eval-engine-frontend:3000
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://${EE_HOST}/oauth2/callback
            - --cookie-secure=true
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --cookie-csrf-per-request=true
            - --cookie-csrf-expire=5m
            # Inject X-Forwarded-Email/User into the UPSTREAM request (proxy mode). --set-xauthrequest
            # alone only sets auth_request RESPONSE headers, which never reach a proxied upstream like
            # Grafana — Grafana's auth-proxy reads X-Forwarded-Email (see 95-grafana.yaml).
            - --pass-user-headers=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: client-id } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: cookie-secret } }
          ports:
            - { name: http, containerPort: 4180 }
          volumeMounts:
            - { name: emails, mountPath: /etc/oauth2-proxy/emails, subPath: emails }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { memory: "256Mi" }
      volumes:
        - name: emails
          configMap: { name: oauth2-proxy-emails }
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: eval-engine
spec:
  selector: { app: oauth2-proxy }
  ports:
    - { name: http, port: 4180, targetPort: 4180 }
---
# Keep ≥1 auth gate up across voluntary disruptions — losing it takes the whole surface down.
# Sessions are cookie-encrypted (shared cookie secret), so any replica serves any request. (RESILIENCE.md §3.4/§12.)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oauth2-proxy
  namespace: eval-engine
spec:
  minAvailable: 1
  selector: { matchLabels: { app: oauth2-proxy } }
