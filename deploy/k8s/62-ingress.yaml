# Public entrypoint: nginx Ingress on the nip.io host, TLS via cert-manager (Let's Encrypt). All
# traffic goes to oauth2-proxy, which authenticates (Google OIDC) then proxies to the API — so both
# the dashboard and /runs are gated. cert-manager auto-issues the cert named in tls.secretName.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eval-engine
  namespace: eval-engine
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"   # OIDC cookies/headers can be large
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["35-202-212-111.nip.io"]
      secretName: eval-engine-tls
  rules:
    - host: "35-202-212-111.nip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port: { number: 4180 }
