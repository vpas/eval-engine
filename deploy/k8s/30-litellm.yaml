# LiteLLM gateway — all model traffic goes through here (DESIGN §8). For the e2e it fronts OpenRouter;
# Redis backs distributed rate-limit/usage state. Workers call it via the OpenAI-compatible API.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: eval-engine
data:
  config.yaml: |
    model_list:
      # Per-model rate limits (DESIGN §2/FR6). rpm/tpm are enforced by the Router; with redis in
      # router_settings the usage counters are shared across ALL gateway replicas, so the cap is
      # GLOBAL (cross-worker), not per-replica — the property DESIGN §12 says to load-test.
      - model_name: "openai/gpt-4o-mini"        # the model our workers use (gateway sees it post-strip)
        litellm_params:
          model: openrouter/openai/gpt-4o-mini
          api_key: os.environ/OPENROUTER_API_KEY
          rpm: 60
          tpm: 200000
      # Dedicated limiter test model: mock_response → no upstream call (zero cost), so a load test
      # exercises the rate limiter in isolation. Low rpm makes the global cap easy to observe.
      - model_name: "ratelimit-test"
        litellm_params:
          model: openai/gpt-4o-mini
          mock_response: "ok"
          rpm: 6
      # wildcard passthrough fallback: the worker sends e.g. "meta-llama/llama-3.1-8b-instruct" (the
      # openai/ prefix is stripped by Inspect's provider) and we route it to openrouter/<that model>.
      # An exact model_name above wins over this wildcard. Keeps the real model id for catalog pricing.
      - model_name: "*"
        litellm_params:
          model: openrouter/*
          api_key: os.environ/OPENROUTER_API_KEY
    litellm_settings:
      drop_params: true
      num_retries: 0          # fail fast: over-limit → 429 immediately, don't retry/cooldown-wait (would hang)
      request_timeout: 20
      callbacks: ["prometheus"]   # expose /metrics on :4000 (QPS/latency/tokens/spend) → scraped by GMP (96-podmonitoring.yaml)
    router_settings:
      # usage-based-routing-v2 + redis = distributed (cross-replica) usage tracking; pre-call checks
      # filter a deployment that is over its rpm/tpm BEFORE routing → over-limit returns HTTP 429.
      routing_strategy: usage-based-routing-v2
      enable_pre_call_checks: true
      num_retries: 0
      allowed_fails: 0
      # The HA Redis cluster (11-redis-ha.yaml: 3 replicas + Sentinel auto-failover, verified) backs the
      # gateway. litellm connects via the stable `redis` Service. NOTE: litellm's router doesn't speak
      # Sentinel (router.py gates redis on redis_host; RedisCache ignores sentinel_nodes) and only writes
      # shared usage counters for multi-deployment models, so per-model rpm/tpm caps here fall back to
      # per-replica in-memory limiting. Acceptable: rate-limit state is soft/rebuildable, and the Redis
      # cluster itself is HA for any component that needs durable-ish shared state.
      redis_host: redis
      redis_port: 6379
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: eval-engine
  labels: { app: litellm }
spec:
  replicas: 2   # ≥2 (DESIGN §8); also makes the global (redis-shared) rate limit testable cross-replica
  selector: { matchLabels: { app: litellm } }
  template:
    metadata:
      labels: { app: litellm }
    spec:
      nodeSelector: { eval-engine/role: system }
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - { name: http, containerPort: 4000 }
          env:
            - name: OPENROUTER_API_KEY
              valueFrom: { secretKeyRef: { name: openrouter, key: key } }
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm, key: master_key } }
            # NOTE: do NOT set REDIS_SENTINEL_NODES / REDIS_SERVICE_NAME — litellm's Sentinel init
            # (_init_redis_sentinel) crashes on startup with "Redis.__init__() got multiple values for
            # argument 'port'", which crash-looped the gateway. litellm's router doesn't reliably speak
            # Sentinel anyway (see the config.yaml note), so we connect via the stable `redis` Service
            # (redis_host/redis_port in config.yaml). Per-model rpm/tpm then falls back to per-replica
            # in-memory limiting — acceptable soft state (DESIGN: the Redis cluster itself is HA).
          volumeMounts:
            - { name: cfg, mountPath: /etc/litellm }
          resources:
            requests: { cpu: "200m", memory: "1Gi" }
            limits:   { memory: "2560Mi" }   # LiteLLM proxy is memory-hungry at startup
          readinessProbe:
            httpGet: { path: /health/liveliness, port: 4000 }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: cfg
          configMap: { name: litellm-config }
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: eval-engine
spec:
  selector: { app: litellm }
  ports:
    - { name: http, port: 4000, targetPort: 4000 }
