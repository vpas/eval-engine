# HA ClickHouse (#16): a 3-replica StatefulSet where each pod runs an EMBEDDED ClickHouse Keeper
# (3-node raft quorum) AND holds a data replica. ReplicatedReplacingMergeTree (analytics._ddl with
# EVAL_ENGINE_CH_CLUSTER=ee) keeps a copy on every replica, Keeper-coordinated, so losing one pod/node
# loses neither coordination nor results. podAntiAffinity spreads the 3 pods across the 3 system nodes
# (terraform ha_stateful=true). Replaces the single-pod Deployment in 10-clickhouse.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-ha-config
  namespace: eval-engine
data:
  # default user: empty password, reachable cluster-internally. MUST live in users.d/ (ClickHouse loads
  # user config from there, not config.d/) — otherwise the default user auth fails (code 516).
  users.xml: |
    <clickhouse>
      <users><default><networks replace="replace"><ip>::/0</ip></networks></default></users>
    </clickhouse>
  config.xml: |
    <clickhouse>
      <listen_host>0.0.0.0</listen_host>
      <!-- per-pod identity: replica = pod name (REPLICA_NAME env, downward API); shard fixed -->
      <macros><shard>01</shard><replica from_env="REPLICA_NAME"/></macros>
      <!-- embedded Keeper (server_id is added per-pod by the initContainer into config.d) -->
      <keeper_server>
        <tcp_port>9181</tcp_port>
        <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
        <coordination_settings>
          <operation_timeout_ms>10000</operation_timeout_ms>
          <session_timeout_ms>30000</session_timeout_ms>
        </coordination_settings>
        <raft_configuration>
          <server><id>1</id><hostname>clickhouse-0.clickhouse-headless</hostname><port>9234</port></server>
          <server><id>2</id><hostname>clickhouse-1.clickhouse-headless</hostname><port>9234</port></server>
          <server><id>3</id><hostname>clickhouse-2.clickhouse-headless</hostname><port>9234</port></server>
        </raft_configuration>
      </keeper_server>
      <!-- point ClickHouse at the embedded Keeper quorum (replication coordination) -->
      <zookeeper>
        <node><host>clickhouse-0.clickhouse-headless</host><port>9181</port></node>
        <node><host>clickhouse-1.clickhouse-headless</host><port>9181</port></node>
        <node><host>clickhouse-2.clickhouse-headless</host><port>9181</port></node>
      </zookeeper>
      <!-- the cluster analytics creates the table ON: 1 shard × 3 replicas -->
      <remote_servers>
        <ee>
          <shard>
            <internal_replication>true</internal_replication>
            <replica><host>clickhouse-0.clickhouse-headless</host><port>9000</port></replica>
            <replica><host>clickhouse-1.clickhouse-headless</host><port>9000</port></replica>
            <replica><host>clickhouse-2.clickhouse-headless</host><port>9000</port></replica>
          </shard>
        </ee>
      </remote_servers>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-headless
  namespace: eval-engine
spec:
  clusterIP: None              # stable per-pod DNS: clickhouse-N.clickhouse-headless
  selector: { app: clickhouse }
  publishNotReadyAddresses: true   # peers must resolve each other during raft formation
  ports:
    - { name: native, port: 9000 }
    - { name: keeper, port: 9181 }
    - { name: raft,   port: 9234 }
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse                # the app connects here (load-balances across the 3 replicas)
  namespace: eval-engine
spec:
  selector: { app: clickhouse }
  ports:
    - { name: http,   port: 8123, targetPort: 8123 }
    - { name: native, port: 9000, targetPort: 9000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: eval-engine
  labels: { app: clickhouse }
spec:
  serviceName: clickhouse-headless
  replicas: 3
  podManagementPolicy: Parallel   # bring all 3 up together so raft can form quorum
  selector: { matchLabels: { app: clickhouse } }
  template:
    metadata:
      labels: { app: clickhouse }
    spec:
      nodeSelector: { eval-engine/role: system }
      affinity:
        podAntiAffinity:           # one replica per node (HA only matters if they're on different nodes)
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: clickhouse } }
              topologyKey: kubernetes.io/hostname
      initContainers:
        # Keeper server_id must be unique per pod; derive it from the StatefulSet ordinal (pod
        # clickhouse-N → server_id N+1) into config.d so ClickHouse merges it onto keeper_server.
        - name: server-id
          image: busybox:1.36
          command: ["sh", "-c", "echo \"<clickhouse><keeper_server><server_id>$(( ${HOSTNAME##*-} + 1 ))</server_id></keeper_server></clickhouse>\" > /config-d/server-id.xml"]
          volumeMounts:
            - { name: config-d, mountPath: /config-d }
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          env:
            - name: REPLICA_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          ports:
            - { name: http,   containerPort: 8123 }
            - { name: native, containerPort: 9000 }
            - { name: keeper, containerPort: 9181 }
            - { name: raft,   containerPort: 9234 }
          resources:
            requests: { cpu: "200m", memory: "700Mi" }
            limits:   { memory: "1800Mi" }
          volumeMounts:
            - { name: data,      mountPath: /var/lib/clickhouse }
            - { name: config,    mountPath: /etc/clickhouse-server/config.d/config.xml, subPath: config.xml }
            - { name: config,    mountPath: /etc/clickhouse-server/users.d/network-access.xml, subPath: users.xml }
            - { name: config-d,  mountPath: /etc/clickhouse-server/config.d/server-id.xml, subPath: server-id.xml }
          readinessProbe:
            httpGet: { path: /ping, port: 8123 }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: clickhouse-ha-config }
        - name: config-d
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
# Never let a voluntary disruption (node upgrade/drain) drop the Keeper raft quorum: keep ≥2 of 3 up.
# (RESILIENCE.md §12.)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clickhouse
  namespace: eval-engine
spec:
  minAvailable: 2
  selector: { matchLabels: { app: clickhouse } }
