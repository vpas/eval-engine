# Read-only infra access for the control-plane API's ops dashboard (Tier-2 "infra truth": pod
# phase / restarts / ready-replicas + KEDA desired-vs-current). Strictly get/list — the API never
# mutates cluster state. Heartbeat-based liveness (orchestrator/workers) needs none of this, so the
# ops tab still works if this is omitted; this just adds the pod-level detail + restart counts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eval-engine-api
  namespace: eval-engine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eval-engine-ops-read
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list"]
---
# Bind in the app namespace (workloads + KEDA) and the sandbox namespace (agentic pods).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eval-engine-ops-read
  namespace: eval-engine
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: eval-engine-ops-read }
subjects:
  - { kind: ServiceAccount, name: eval-engine-api, namespace: eval-engine }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eval-engine-ops-read
  namespace: eval-sandbox
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: eval-engine-ops-read }
subjects:
  - { kind: ServiceAccount, name: eval-engine-api, namespace: eval-engine }
