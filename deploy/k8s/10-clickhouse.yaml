# Test-grade single-pod ClickHouse on the always-on system node. NOT HA; fine for the e2e.
# Default user, no password (matches analytics_ch.py). Small PVC for persistence.
#
# The :24.8 image ships a default-user.xml restricting `default` to localhost (::1/127.0.0.1), which
# blocks in-cluster Service access. This ConfigMap overrides `default`'s networks to allow the pod
# network (test-grade — empty password, cluster-internal only).
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-users
  namespace: eval-engine
data:
  network-access.xml: |
    <clickhouse>
      <users>
        <default>
          <networks replace="replace"><ip>::/0</ip></networks>
        </default>
      </users>
    </clickhouse>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  namespace: eval-engine
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: eval-engine
  labels: { app: clickhouse }
spec:
  replicas: 1
  strategy: { type: Recreate }        # single PVC; don't run two pods at once
  selector: { matchLabels: { app: clickhouse } }
  template:
    metadata:
      labels: { app: clickhouse }
    spec:
      nodeSelector: { eval-engine/role: system }
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          ports:
            - { name: http,   containerPort: 8123 }
            - { name: native, containerPort: 9000 }
          # No CLICKHOUSE_* env on purpose: that triggers the image's "managed config" mode and
          # breaks passwordless `default`. Vanilla = default user, empty password (test-grade).
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { memory: "1536Mi" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: users, mountPath: /etc/clickhouse-server/users.d/network-access.xml, subPath: network-access.xml }
          readinessProbe:
            httpGet: { path: /ping, port: 8123 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: clickhouse-data }
        - name: users
          configMap: { name: clickhouse-users }
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: eval-engine
spec:
  selector: { app: clickhouse }
  ports:
    - { name: http,   port: 8123, targetPort: 8123 }
    - { name: native, port: 9000, targetPort: 9000 }
