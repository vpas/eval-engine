# Workers — claim→execute→commit→load over the ledger. On the SPOT pool (toleration + nodeSelector),
# so scheduling a worker scales the pool 0→1. Model calls go through the LiteLLM gateway.
# replicas is managed by KEDA (deploy/k8s/70-keda.yaml): 0 when idle, up to 3 on ledger depth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-engine-worker
  namespace: eval-engine
  labels: { app: eval-engine-worker }
spec:
  replicas: 0
  selector: { matchLabels: { app: eval-engine-worker } }
  template:
    metadata:
      labels: { app: eval-engine-worker }
    spec:
      # Let an in-flight batch finish on SIGTERM (graceful drain) before SIGKILL — above the per-sample
      # timeout so a rolling update doesn't strand freshly-claimed tasks (eval_engine/worker._graceful_shutdown).
      terminationGracePeriodSeconds: 150
      serviceAccountName: eval-engine-worker     # RBAC to manage agentic sandbox pods (90-sandbox-rbac)
      nodeSelector: { eval-engine/role: worker }
      tolerations:
        - { key: eval-engine/worker, operator: Equal, value: "true", effect: NoSchedule }
      containers:
        - name: worker
          image: us-central1-docker.pkg.dev/eval-engine/eval-engine/app:latest
          imagePullPolicy: Always
          command: ["python", "-m", "eval_engine.worker"]
          env:
            - name: EVAL_ENGINE_PG_DSN
              valueFrom: { secretKeyRef: { name: eval-pg, key: dsn } }
            - { name: EVAL_ENGINE_CH_HOST, value: clickhouse }
            - { name: EVAL_ENGINE_CH_PORT, value: "8123" }
            - { name: EVAL_ENGINE_CH_CLUSTER, value: ee }   # HA: replicated table ON CLUSTER (#16)
            - { name: EVAL_ENGINE_GCS_BUCKET, value: eval-engine-eval-engine }   # write transcripts to GCS
            - { name: EVAL_ENGINE_TRANSCRIPT_SAMPLE_RATE, value: "0.25" }        # sample-by-default; failures always kept (DESIGN §13)
            - { name: EVAL_ENGINE_MODEL_TIMEOUT, value: "120" }                  # per-request timeout (s) — a hung gateway/provider call can't wedge the worker
            - { name: EVAL_ENGINE_SAMPLE_TIME_LIMIT, value: "600" }              # per-sample wall-clock cap (s)
            - { name: INSPECT_K8S_DEFAULT_NAMESPACE, value: eval-sandbox }       # agentic sandbox pods land here
            # model calls via the gateway (OpenAI-compatible) → LiteLLM → OpenRouter
            - { name: OPENAI_BASE_URL, value: "http://litellm:4000/v1" }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: litellm, key: master_key } }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { memory: "1536Mi" }
