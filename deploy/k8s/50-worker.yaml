# Workers — claim→execute→commit→load over the ledger. On the SPOT pool (toleration + nodeSelector),
# so scheduling a worker scales the pool 0→1. Model calls go through the LiteLLM gateway.
# replicas is managed by KEDA (deploy/k8s/70-keda.yaml): 0 when idle, up to 3 on ledger depth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-engine-worker
  namespace: eval-engine
  labels: { app: eval-engine-worker }
spec:
  replicas: 0
  selector: { matchLabels: { app: eval-engine-worker } }
  template:
    metadata:
      labels: { app: eval-engine-worker }
    spec:
      nodeSelector: { eval-engine/role: worker }
      tolerations:
        - { key: eval-engine/worker, operator: Equal, value: "true", effect: NoSchedule }
      containers:
        - name: worker
          image: us-central1-docker.pkg.dev/eval-engine/eval-engine/app:latest
          imagePullPolicy: Always
          command: ["python", "-m", "eval_engine.worker"]
          env:
            - { name: EVAL_ENGINE_BACKEND, value: postgres }
            - name: EVAL_ENGINE_PG_DSN
              valueFrom: { secretKeyRef: { name: eval-pg, key: dsn } }
            - { name: EVAL_ENGINE_CH_HOST, value: clickhouse }
            - { name: EVAL_ENGINE_CH_PORT, value: "8123" }
            # model calls via the gateway (OpenAI-compatible) → LiteLLM → OpenRouter
            - { name: OPENAI_BASE_URL, value: "http://litellm:4000/v1" }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: litellm, key: master_key } }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { memory: "1536Mi" }
