# Helm values for inspect-k8s-sandbox's agent-env chart on THIS cluster.
# Our GKE cluster has no GKE Sandbox (gVisor) node pool, so override the chart's default
# runtimeClassName (gvisor) with the chart's magic "CLUSTER_DEFAULT" string → the sandbox pod runs
# on a normal node (runc), no gVisor nodeSelector. Weaker isolation than gVisor; acceptable for the
# in-cluster proof. Production T2 isolation = a GKE Sandbox node pool (docs/SANDBOXING.md, FUTURE.md §4).
services:
  default:
    runtimeClassName: CLUSTER_DEFAULT
    # Mirror the Docker air-gap proof (deploy/sandbox/airgap-compose.yaml): a secret that exists ONLY
    # inside the sandbox — never in the worker env nor the prompt. examples/sandbox_qa.jsonl sb1 can
    # only be answered by reading it WITH the bash tool, so a passing score is itself proof the tool
    # ran INSIDE this pod (not in the worker). Same value as the Docker compose so the dataset is
    # sandbox-provider-agnostic (docker|k8s).
    env:
      - name: EE_SANDBOX_SECRET
        value: "in-sandbox-7f3a9c"
