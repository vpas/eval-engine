[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-engine"
version = "0.1.0"
description = "eval-engine: Inspect kernel + Postgres ledger + control plane + ClickHouse analytics + dashboard"
requires-python = ">=3.10"
dependencies = [
  "inspect-ai",
  "duckdb",
  "pydantic>=2",
  "pyyaml",
  "fastapi",
  "uvicorn[standard]",
]

[project.optional-dependencies]
# real backends (Postgres ledger + ClickHouse analytics; local: infra/up.sh)
postgres = ["psycopg[binary]", "clickhouse-connect"]
# real models via OpenRouter (Inspect's openrouter/ provider needs the openai client)
openrouter = ["openai"]
# transcript object store on GCS (ADC = the GKE node service account)
gcs = ["google-cloud-storage"]
# agentic sandboxing on Kubernetes (helm-deployed per-sample pods); needs helm in the image + RBAC
k8s = ["inspect-k8s-sandbox"]

[project.scripts]
eval-engine = "eval_engine.cli:main"

[tool.setuptools]
packages = ["eval_engine"]
