[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-engine"
version = "0.1.0"
description = "eval-engine: Inspect kernel + Postgres ledger + control plane + ClickHouse analytics + dashboard"
requires-python = ">=3.10"
dependencies = [
  # >=0.3.235: the log viewer's client builds API URLs relative to --log-dir (directoryRelativeUrl),
  # so gs:// log paths are stripped to clean basenames — no `//` for the oauth2-proxy path-cleaner to
  # collapse (the deep-link "Failed to fetch" bug). Older builds (0.3.69) sent full gs:// to /log-size.
  "inspect-ai>=0.3.235",
  # storage tier: Postgres control plane + ClickHouse analytics (local: infra/up.sh). Required —
  # there is no in-memory/sqlite stand-in; the package talks to these two backends directly.
  # [pool] = psycopg_pool: one bounded connection pool per process (control.py), not a hand-rolled
  # thread-local connection-per-thread.
  "psycopg[binary,pool]",
  "clickhouse-connect",
  # Postgres schema migrations (eval_engine/migrations/*.sql, applied at control.init()) — replaces the
  # hand-rolled CREATE + idempotent-ALTER string. yoyo's postgres backend speaks psycopg2, hence the
  # extra binary driver (used only at startup to apply migrations, never on a query path).
  "yoyo-migrations",
  "psycopg2-binary",
  # structured (JSON) logging for GCP Cloud Logging: a `severity` field + jsonPayload instead of a text
  # line (logs.py; on when EVAL_ENGINE_LOG_JSON or EVAL_ENGINE_GCP_PROJECT is set, text otherwise).
  "python-json-logger",
  "pydantic>=2",
  "pyyaml",
  "fastapi",
  "uvicorn[standard]",
  # object storage via a single fsspec interface (DESIGN §4): no native cloud SDK in app code, so the
  # store is swappable by URI scheme. The gs:// driver (gcsfs) ships in the [gcs] extra (cluster only).
  "fsspec",
  # zstd compression for stored transcripts (DESIGN §13 retention)
  "zstandard",
]

[project.optional-dependencies]
# real models via OpenRouter (Inspect's openrouter/ provider needs the openai client)
openrouter = ["openai"]
# gs:// driver for fsspec (ADC = the GKE node service account) — also what Inspect uses to read/write
# its .eval logs to gs:// (for the Inspect log viewer). No native google-cloud SDK: app code is S3-portable.
gcs = ["gcsfs"]
# agentic sandboxing on Kubernetes (helm-deployed per-sample pods); needs helm in the image + RBAC
k8s = ["inspect-k8s-sandbox"]
# ops dashboard probes: a Redis client (master/replica health) + the Kubernetes client (pod phase /
# restarts / KEDA, the Tier-2 infra truth). Both degrade gracefully when absent (local dev).
ops = ["redis", "kubernetes"]
# real benchmark suite (docs/ADDING_REAL_EVALS.md): sympy backs the `math` scorer (Inspect core's
# mathematical-equivalence checking for MATH/AIME). `regex` rides in transitively via inspect-ai.
# NB: `datasets` (HF) is NOT here — it's one-shot ingestion tooling (tools/fetch_benchmark.py), never
# imported by the engine at runtime.
benchmarks = ["sympy"]
# test suite (pytest). Integration/e2e tests also need infra/up.sh (Postgres + ClickHouse).
test = ["pytest>=8"]

[project.scripts]
eval-engine = "eval_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# layers as markers (also mirrored by the tests/{unit,integration,e2e}/ dirs):
#   unit        — pure logic, no I/O (no Postgres/ClickHouse needed)
#   integration — one module against its real backend in isolation (needs infra/up.sh)
#   e2e         — the full spine / sandbox (needs infra/up.sh; sandbox also needs docker)
markers = [
  "unit: pure logic, no I/O (no backends needed)",
  "integration: needs Postgres + ClickHouse (infra/up.sh)",
  "e2e: full-spine or sandbox test (slower; needs infra/up.sh, sandbox needs docker)",
]

[tool.setuptools]
packages = ["eval_engine"]

# Ship the SQL migration files inside the wheel/sdist (they're data, not a Python package) so
# control.init() can find them in a built image, not just an editable source checkout.
[tool.setuptools.package-data]
eval_engine = ["migrations/*.sql"]
