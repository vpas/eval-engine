[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-engine"
version = "0.1.0"
description = "eval-engine: Inspect kernel + Postgres ledger + control plane + ClickHouse analytics + dashboard"
requires-python = ">=3.10"
dependencies = [
  # >=0.3.235: the log viewer's client builds API URLs relative to --log-dir (directoryRelativeUrl),
  # so gs:// log paths are stripped to clean basenames — no `//` for the oauth2-proxy path-cleaner to
  # collapse (the deep-link "Failed to fetch" bug). Older builds (0.3.69) sent full gs:// to /log-size.
  "inspect-ai>=0.3.235",
  # storage tier: Postgres control plane + ClickHouse analytics (local: infra/up.sh). Required —
  # there is no in-memory/sqlite stand-in; the package talks to these two backends directly.
  "psycopg[binary]",
  "clickhouse-connect",
  "pydantic>=2",
  "pyyaml",
  "fastapi",
  "uvicorn[standard]",
]

[project.optional-dependencies]
# real models via OpenRouter (Inspect's openrouter/ provider needs the openai client)
openrouter = ["openai"]
# transcript object store on GCS (ADC = the GKE node service account); gcsfs so Inspect can read/write
# its .eval logs to gs:// (for the Inspect log viewer)
gcs = ["google-cloud-storage", "gcsfs"]
# agentic sandboxing on Kubernetes (helm-deployed per-sample pods); needs helm in the image + RBAC
k8s = ["inspect-k8s-sandbox"]
# test suite (pytest). Integration/e2e tests also need infra/up.sh (Postgres + ClickHouse).
test = ["pytest>=8"]

[project.scripts]
eval-engine = "eval_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# layers as markers (also mirrored by the tests/{unit,integration,e2e}/ dirs):
#   unit        — pure logic, no I/O (no Postgres/ClickHouse needed)
#   integration — one module against its real backend in isolation (needs infra/up.sh)
#   e2e         — the full spine / sandbox (needs infra/up.sh; sandbox also needs docker)
markers = [
  "unit: pure logic, no I/O (no backends needed)",
  "integration: needs Postgres + ClickHouse (infra/up.sh)",
  "e2e: full-spine or sandbox test (slower; needs infra/up.sh, sandbox needs docker)",
]

[tool.setuptools]
packages = ["eval_engine"]
