<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>eval-engine</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --fg:#e6edf3; --mut:#8b949e;
          --acc:#3b82f6; --ok:#2ea043; --bad:#cf3b3b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header h1 { font-size:16px; margin:0; font-weight:650; letter-spacing:.2px; }
  header .tag { color:var(--mut); font-size:12px; border:1px solid var(--line); padding:1px 7px; border-radius:10px; }
  .wrap { display:grid; grid-template-columns:320px 1fr; gap:0; height:calc(100vh - 51px); }
  .col { padding:16px 18px; overflow:auto; }
  .col.left { border-right:1px solid var(--line); }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--mut); margin:0 0 10px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:18px; }
  label { display:block; font-size:12px; color:var(--mut); margin:10px 0 4px; }
  input, select { width:100%; background:#0d1117; color:var(--fg); border:1px solid var(--line);
                  border-radius:7px; padding:7px 9px; font-size:13px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:7px; padding:9px 14px;
           font-size:13px; font-weight:600; cursor:pointer; margin-top:14px; width:100%; }
  button:hover { filter:brightness(1.08); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  tr.run { cursor:pointer; } tr.run:hover td { background:#1b2230; }
  tr.run.sel td { background:#1d2740; }
  .badge { font-size:11px; padding:1px 7px; border-radius:9px; border:1px solid var(--line); }
  .b-completed { color:var(--ok); border-color:#1f5130; } .b-running { color:#d9a441; border-color:#5a4a1f; }
  .b-queued { color:var(--mut); }
  .stat { display:inline-block; margin-right:18px; }
  .stat b { font-size:20px; display:block; }
  .pill { font-size:11px; padding:1px 6px; border-radius:6px; }
  .pass { color:var(--ok); } .fail { color:var(--bad); }
  .bar { height:7px; background:#0d1117; border-radius:4px; overflow:hidden; border:1px solid var(--line); }
  .bar > i { display:block; height:100%; background:var(--acc); }
  .muted { color:var(--mut); } .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  .empty { color:var(--mut); padding:30px 0; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>eval-engine</h1><span class="tag">prototype dashboard</span>
  <span class="tag" id="health">·</span>
</header>
<div class="wrap">
  <div class="col left">
    <h2>Launch a run</h2>
    <div class="panel">
      <label>Eval name</label><input id="f-eval" value="capitals_qa" />
      <label>Dataset</label><input id="f-dataset" value="examples/qa.jsonl" />
      <label>Model</label><input id="f-model" value="mockllm/model" />
      <label>Mock output (mockllm only)</label><input id="f-mock" value="Paris" />
      <label>Harness</label><select id="f-harness"></select>
      <label>Scorer</label><select id="f-scorer"></select>
      <label>Batch size</label><input id="f-batch" type="number" value="2" min="1" />
      <button id="launch">▶ Launch run</button>
    </div>
    <h2>Runs</h2>
    <table><thead><tr><th>eval</th><th>model</th><th>acc</th><th>n</th><th>by</th></tr></thead>
      <tbody id="runs"></tbody></table>
  </div>
  <div class="col right">
    <h2>Results</h2>
    <div id="results"><div class="empty">Select a run, or launch one.</div></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let selected = null, pollTimer = null;

async function jget(u){ const r = await fetch(u); if(!r.ok) throw new Error(await r.text()); return r.json(); }

async function loadCatalog(){
  const cat = await jget('/catalog');
  const h = $('#f-harness'), s = $('#f-scorer');
  h.innerHTML=''; s.innerHTML='';
  cat.filter(p=>p.kind==='harness').forEach(p=>h.add(new Option(`${p.name}@${p.version}`, p.name)));
  cat.filter(p=>p.kind==='scorer').forEach(p=>s.add(new Option(`${p.name}@${p.version}`, p.name)));
}

async function loadRuns(){
  const runs = await jget('/runs');
  const tb = $('#runs'); tb.innerHTML='';
  if(!runs.length){ tb.innerHTML='<tr><td colspan=4 class="muted">no runs yet</td></tr>'; return; }
  for(const r of runs){
    const tr = document.createElement('tr');
    tr.className = 'run' + (r.id===selected?' sel':'');
    const acc = r.accuracy==null ? '·' : (r.accuracy*100).toFixed(0)+'%';
    const by = r.created_by ? r.created_by.split('@')[0] : '·';
    tr.innerHTML = `<td>${r.eval}</td><td class="mono">${r.model}</td><td>${acc}</td><td>${r.total}</td><td title="${r.created_by||''}">${by}</td>`;
    tr.onclick = ()=>select(r.id);
    tb.appendChild(tr);
  }
}

async function launch(){
  const body = {
    eval: $('#f-eval').value, dataset: $('#f-dataset').value, model: $('#f-model').value,
    mock_output: $('#f-mock').value, batch_size: +$('#f-batch').value,
    harness: { type: $('#f-harness').value },
    scorers: [ { type: $('#f-scorer').value, config: { ignore_case: true } } ],
  };
  const r = await fetch('/runs', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
  if(!r.ok){ alert('launch failed: ' + await r.text()); return; }
  const { run_id } = await r.json();
  await loadRuns(); select(run_id);
}

async function select(id){
  selected = id; await loadRuns();
  if(pollTimer) clearInterval(pollTimer);
  await renderRun();
  pollTimer = setInterval(renderRun, 1000);
}

async function renderRun(){
  if(!selected) return;
  const run = await jget('/runs/'+selected);
  let html = `<div class="panel"><div class="muted mono">${run.id}</div>
    <h3 style="margin:6px 0">${run.eval_id} · <span class="mono">${run.model}</span>
      <span class="badge b-${run.status}">${run.status}</span></h3>`;
  if(run.status!=='completed'){
    const p = run.progress||{}; const total = run.total||0;
    const done = (p.done||0); const pct = total? Math.round(100*done/total):0;
    html += `<div class="muted">progress: queued=${p.queued||0} running=${p.running||0} done=${done} / ${total}</div>
      <div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>`;
    $('#results').innerHTML = html; return;
  }
  const res = await jget('/runs/'+selected+'/results'); const su = res.summary;
  html += `<div style="margin-top:8px">
    <span class="stat"><b>${(su.accuracy*100).toFixed(0)}%</b><span class="muted">accuracy</span></span>
    <span class="stat"><b>${su.passed}/${su.samples}</b><span class="muted">passed</span></span>
    <span class="stat"><b>${su.tokens}</b><span class="muted">tokens</span></span>
    <span class="stat"><b>$${su.cost_usd.toFixed(4)}</b><span class="muted">cost</span></span></div></div>`;

  html += `<div class="panel"><h2>Accuracy by category</h2><table>
    <thead><tr><th>category</th><th>n</th><th>passed</th><th>accuracy</th></tr></thead><tbody>`;
  for(const c of res.by_category){
    const pct = (c.accuracy*100).toFixed(0);
    html += `<tr><td>${c.category||'(none)'}</td><td>${c.n}</td><td>${c.passed}</td>
      <td><div class="bar" style="width:80px;display:inline-block;vertical-align:middle"><i style="width:${pct}%"></i></div> ${pct}%</td></tr>`;
  }
  html += `</tbody></table></div>`;

  html += `<div class="panel"><h2>Samples</h2><table>
    <thead><tr><th>sample</th><th>result</th><th>category</th><th>score</th></tr></thead><tbody>`;
  for(const s of res.samples){
    const sid = s.transcript_uri
      ? `<a href="/transcript?uri=${encodeURIComponent(s.transcript_uri)}" target="_blank">${s.sample_id} ↗</a>`
      : s.sample_id;
    html += `<tr><td class="mono">${sid}</td>
      <td class="${s.passed?'pass':'fail'}">${s.passed?'✓ pass':'✗ fail'}</td>
      <td>${s.category||'-'}</td><td>${s.score.toFixed(2)}</td></tr>`;
  }
  html += `</tbody></table></div>`;
  if(pollTimer && run.status==='completed'){ clearInterval(pollTimer); pollTimer=null; }
  $('#results').innerHTML = html;
}

(async ()=>{
  try { const h = await jget('/healthz'); $('#health').textContent = h.status; } catch(e){}
  await loadCatalog(); await loadRuns();
  $('#launch').onclick = launch;
  setInterval(loadRuns, 2500);
})();
</script>
</body>
</html>
